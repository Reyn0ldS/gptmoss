[tool.ruff]
target-version = "py310"
exclude = [
  "python-3.13.14-embed-amd64",
  "venv",
  "workspace",
]

[tool.ruff.lint]
# Start with correctness rules that can safely gate an established codebase.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
